name: Dev platform design module (static SPA)

on:
  push:
    branches: [main]
    paths:
      - 'products/dev-platform-web/**'
      - 'scripts/lib/**'
      - 'style-presets/**'
      - 'awesome-design-md/**'
      - 'awesome-design-skills-main/**'
      - '.github/workflows/dev-platform-static-previews.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dev-platform-design-module
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch design source clones
        run: |
          git clone --depth 1 https://github.com/bergside/awesome-design-skills.git awesome-design-skills-main
          git clone --depth 1 https://github.com/voltagent/awesome-design-md.git awesome-design-md-main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: products/dev-platform-web/package-lock.json

      - name: Install dependencies
        working-directory: products/dev-platform-web
        run: npm ci

      - name: Build static design module SPA
        working-directory: products/dev-platform-web
        run: npm run static:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: products/dev-platform-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
