name: visual regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Actions does not allow `secrets.*` to be referenced from a step
    # `if:` expression. Hoisting the token into job-level env exposes it as
    # `env.CHROMATIC_PROJECT_TOKEN`, which IS readable from a step's `if:`.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright
        env:
          BASE_URL: ${{ env.PREVIEW_URL || 'http://127.0.0.1:5173' }}
        run: npm run test:e2e

      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@latest
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          playwright: true
          exitZeroOnChanges: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
