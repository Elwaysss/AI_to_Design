name: visual regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Actions does not allow `secrets.*` to be referenced from a step
    # `if:` expression. Hoisting the token into job-level env exposes it as
    # `env.CHROMATIC_PROJECT_TOKEN`, which IS readable from a step's `if:`.
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Without a Chromatic token, run the full multi-browser Playwright suite.
      - name: Run Playwright
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        env:
          BASE_URL: ${{ env.PREVIEW_URL || 'http://127.0.0.1:5173' }}
        run: npm run test:e2e

      # With a token, let Chromatic run Playwright + archive + upload in one step.
      # Do NOT run test:e2e separately first — that produces an empty archive
      # and fails with "Invalid test suite build" on chromaui/action@latest.
      - name: Run Playwright with Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          BASE_URL: ${{ env.PREVIEW_URL || 'http://127.0.0.1:5173' }}
        run: npx chromatic --playwright --exit-zero-on-changes

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
