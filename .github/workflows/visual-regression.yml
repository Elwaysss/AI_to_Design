name: visual regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build tokens
        run: npm run tokens:build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # No Chromatic token → full multi-browser functional suite.
      # baseURL comes from playwright.config.ts (hash of package.json name).
      # Set secrets.PREVIEW_URL only when testing a deployed preview.
      - name: Run Playwright
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: npm run test:e2e

      # Chromatic token → two-step Playwright visual pipeline:
      #   1) playwright test writes test-results/chromatic-archives/
      #   2) chromatic --playwright reads archives and uploads
      - name: Run Playwright (Chromatic archives)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: npx playwright test --project=chromium

      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: npx chromatic --playwright --exit-zero-on-changes --ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
